name: pawtrack
description: PawTrack - Registro, seguimiento sanitario y reporte de incidencias de perros de la ESPOCH.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  google_mlkit_image_labeling: ^0.14.0
  http: ^1.2.2
  intl: ^0.19.0
  file_picker: ^13.3.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
